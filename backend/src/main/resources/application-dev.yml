
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/brightloop_db}
    username: ${DB_USERNAME:brightloop_user}
    password: ${DB_PASSWORD:BrightLoop@2026}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
